name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      # Next 16 generates the `LayoutProps` / `PageProps` route types into `.next/types`,
      # which is gitignored and therefore absent in a fresh CI checkout. Without this step
      # `tsc --noEmit` fails with `TS2304: Cannot find name 'LayoutProps'` in
      # src/app/layout.tsx — a CI-only failure that does not reproduce locally, because a
      # local `next dev`/`next build` has already written those types.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      # Playwright (`npm run test:browser`) is deliberately NOT run here. It targets the
      # deployed Vercel URL, so running it on every push would race the very deploy it is
      # meant to verify, and it would fail on forks where that URL is not available.
      # It is run against the live URL after the deploy lands instead.
